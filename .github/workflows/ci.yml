# Build the site and run the browser smoke tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # playwright-core ships no browser and no installer CLI, so fetch one with the
      # matching playwright release. tests/smoke.mjs finds it in the default cache.
      - name: Install Chromium
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - run: npm run build

      - run: npm test

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
